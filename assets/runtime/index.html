<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VoidTV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HUD Top Header -->
  <header class="hud-header">
    <div class="hud-left">
      <span class="hud-badge">VOID.TV</span>
      <span class="hud-model" id="hud-model">SINGER R3</span>
    </div>
    <div class="hud-center">
      <span class="hud-clock" id="hud-clock">00:00</span>
      <span class="hud-date" id="hud-date">Thu, Nov 19</span>
    </div>
    <div class="hud-right">
      <span class="hud-stat" id="hud-ram">RAM: --MB</span>
      <span class="hud-stat" id="hud-remote">REMOTE: ...</span>
    </div>
  </header>

  <!-- Main Leanback TV Rows Container -->
  <main class="tv-container" id="tv-container">
    <!-- Dynamic sections injected via app.js -->
  </main>

  <!-- In-App Dashboard & Favorites Customizer Overlay -->
  <div class="customizer-overlay" id="customizer-overlay" style="display: none;">
    <div class="customizer-header">
      <div class="customizer-title-wrap">
        <span class="customizer-badge">VOID.CFG</span>
        <span class="customizer-title">DASHBOARD &amp; FAVORITES CUSTOMIZER</span>
      </div>
      <div class="customizer-tabs" id="customizer-tabs">
        <button class="cz-tab active" data-tab="favs" id="tab-favs">⭐ FAVORITES</button>
        <button class="cz-tab" data-tab="rows" id="tab-rows">📑 DASHBOARD ROWS</button>
        <button class="cz-tab" data-tab="theme" id="tab-theme">🎨 THEMES &amp; STYLE</button>
        <button class="cz-tab" data-tab="backup" id="tab-backup">💾 RESET / DEFAULTS</button>
      </div>
      <button class="customizer-close-btn" id="cz-close-btn">✕ EXIT / SAVE (BACK)</button>
    </div>
    <div class="customizer-body" id="customizer-body">
      <!-- Injected dynamically by CustomizerEngine -->
    </div>
  </div>

  <!-- In-App File Manager Overlay -->
  <div class="fm-overlay" id="fm-overlay" style="display: none;">
    <div class="fm-header">
      <div class="fm-title">📁 FILE MANAGER</div>
      <div class="fm-path" id="fm-path">/storage/emulated/0</div>
      <button class="fm-close-btn" id="fm-close-btn">✕ EXIT (BACK)</button>
    </div>
    <div class="fm-body" id="fm-body">
      <div class="fm-grid" id="fm-grid">
        <!-- Injected dynamically by FileManager -->
      </div>
    </div>
  </div>

  <!-- Live Hot-Reload Notification Toast -->
  <div class="toast" id="toast">Live Reload Active</div>

  <script src="qrcode.min.js"></script>
  <script src="builtins.js"></script>
  <script src="app.js"></script>
</body>
</html>
